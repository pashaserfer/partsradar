<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartsRadar — Поиск автозапчастей</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; padding: 16px; margin: 0; }
        .container { max-width: 820px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; }
        .logo { font-size: 28px; font-weight: 800; color: #2563eb; }
        .tagline { color: #64748b; font-size: 14px; margin-top: 4px; }
        .search-card { background: #fff; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .search-form { display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 12px 16px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 10px; text-transform: uppercase; }
        .search-btn { padding: 12px 24px; font-size: 16px; font-weight: 600; color: #fff; background: #2563eb; border: none; border-radius: 10px; cursor: pointer; }
        .examples { margin-top: 10px; font-size: 13px; color: #64748b; }
        .chip { background: #f1f5f9; padding: 4px 10px; border-radius: 6px; color: #2563eb; cursor: pointer; margin-left: 6px; font-weight: 600; border: none; }
        .status { margin-bottom: 12px; font-size: 13px; color: #64748b; }
        .badge-demo { background: #fef3c7; color: #92400e; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .badge-live { background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .card.best { background: #ecfdf5; border-color: #10b981; }
        .price { font-size: 18px; font-weight: 800; }
        .btn-buy { display: inline-block; padding: 6px 14px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; font-size: 13px; margin-top: 4px; }
        .ad-banner { margin-top: 24px; padding: 16px; background: #fff; border: 1px dashed #cbd5e1; border-radius: 12px; text-align: center; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">📡 PartsRadar</div>
        <div class="tagline">Находим самые выгодные цены и сроки доставки автозапчастей по артикулу</div>
    </header>

    <div class="search-card">
        <div class="search-form">
            <input type="text" id="artInput" class="search-input" value="OC90" placeholder="Введите артикул">
            <button type="button" id="searchBtn" class="search-btn">Найти цены</button>
        </div>
        <div class="examples">
            Примеры для проверки:
            <button type="button" class="chip" data-art="OC90">OC90</button>
            <button type="button" class="chip" data-art="2630035505">2630035505</button>
            <button type="button" class="chip" data-art="4806009030">4806009030</button>
        </div>
    </div>

    <div id="status" class="status"></div>
    <div id="results"></div>
    <div class="ad-banner">Место для рекламного блока (Автосервисы, ОСАГО или РСЯ)</div>
</div>

<script>
 const API_URL = "https://partsradar-serfer.msk1.amvera.tech/api/search";



    async function runSearch(article) {
        const cleanArt = article.trim().toUpperCase();
        if (!cleanArt) return;
        document.getElementById('artInput').value = cleanArt;
        document.getElementById('status').innerHTML = "Сканируем магазины...";

        let offers = [];
        let isLive = false;

        try {
            const controller = new AbortController();
            setTimeout(() => controller.abort(), 8000);
            const res = await fetch(`${API_URL}?article=${encodeURIComponent(cleanArt)}`, { signal: controller.signal });
            if (res.ok) {
                const data = await res.json();
                offers = data.offers || [];
                isLive = true;
            }
        } catch (e) {}

        if (!isLive || offers.length === 0) {
            offers = [
                { store: "Emex", brand: "MAHLE / KNECHT", article: cleanArt, name: "Фильтр масляный", price: 615, days: 3, url: `https://emex.ru{cleanArt}` },
                { store: "Autodoc", brand: "MAHLE / KNECHT", article: cleanArt, name: "Фильтр масляный", price: 640, days: 1, url: `https://autodoc.ru{cleanArt}` },
                { store: "Exist", brand: "MAHLE / KNECHT", article: cleanArt, name: "Фильтр масляный", price: 690, days: 2, url: `https://exist.ru{cleanArt}` },
                { store: "Ozon", brand: "MAHLE / KNECHT", article: cleanArt, name: "Фильтр масляный", price: 780, days: 1, url: `https://ozon.ru{cleanArt}` }
            ];
        }

        const minPrice = Math.min(...offers.map(o => o.price));
        document.getElementById('status').innerHTML = isLive 
            ? `Найдено: <b>${offers.length}</b> <span class="badge-live">Подключено к Python-серверу</span>`
            : `Найдено: <b>${offers.length}</b> <span class="badge-demo">Демо-режим (сервер не запущен)</span>`;

        document.getElementById('results').innerHTML = offers.map(o => `
            <div class="card ${o.price === minPrice ? 'best' : ''}">
                <div>
                    <b>${o.store}</b> • ${o.brand} (${o.article})<br>
                    <small style="color:#64748b">${o.name} • Доставка: ${o.days} дн.</small>
                </div>
                <div style="text-align:right">
                    <div class="price">${o.price} ₽</div>
                    <a href="${o.url}" target="_blank" class="btn-buy">Перейти</a>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('searchBtn').addEventListener('click', () => runSearch(document.getElementById('artInput').value));
    document.getElementById('artInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') runSearch(e.target.value); });
    document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => runSearch(btn.dataset.art)));

    runSearch('OC90');
</script>
</body>
</html>
