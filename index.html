<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск автозапчастей по артикулу</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #0f172a;
            font-size: 24px;
            margin-top: 0;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            text-transform: uppercase;
        }
        input:focus {
            border-color: #1d4ed8;
        }
        button.primary {
            background-color: #1d4ed8;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.primary:hover {
            background-color: #1e40af;
        }
        .history {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            align-items: center;
        }
        .history-label {
            font-size: 13px;
            color: #64748b;
        }
        .history-tag {
            background: #e2e8f0;
            color: #334155;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }
        .history-tag:hover {
            background: #cbd5e1;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #f8fafc;
        }
        .card-title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 6px;
            color: #0f172a;
        }
        .card-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 16px;
        }
        .card a {
            display: block;
            text-align: center;
            background: #ffffff;
            color: #1d4ed8;
            border: 1px solid #1d4ed8;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .card a:hover {
            background: #1d4ed8;
            color: #ffffff;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }
        .footer a {
            color: #1d4ed8;
            text-decoration: none;
        }
        @media (max-width: 500px) {
            .search-box { flex-direction: column; }
            button.primary { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Поиск запчастей по артикулу</h1>
    <div class="subtitle">Сравните цены и сроки доставки в магазинах и на маркетплейсах в один клик</div>

    <div class="search-box">
        <input type="text" id="partInput" placeholder="Например: 480-1012010" onkeypress="if(event.key==='Enter') searchPart()">
        <button class="primary" onclick="searchPart()">Найти цены</button>
    </div>

    <div class="history" id="historyBox" style="display: none;">
        <span class="history-label">Недавние:</span>
        <div id="historyTags" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
    </div>

    <div id="results" class="grid"></div>

    <div class="footer">
        Прототип сервиса подбора запчастей. <a href="https://t.me" target="_blank">Нашли ошибку или есть идея? Напишите автору</a>
    </div>
</div>

<script>
    const stores = [
        { name: "Autodoc (Автодок)", desc: "Крупный автомагазин, точные сроки", url: code => `https://autodoc.ru{code}` },
        { name: "Emex (Емекс)", desc: "Большой выбор аналогов и оптовиков", url: code => `https://emex.ru{code}` },
        { name: "Exist (Экзист)", desc: "Проверенные поставщики и каталоги", url: code => `https://exist.ru{code}` },
        { name: "ZZap (ЗетЗап)", desc: "Агрегатор цен от мелких продавцов", url: code => `https://zzap.ru{code}` },
        { name: "Ozon", desc: "Быстрая доставка в пункт выдачи", url: code => `https://ozon.ru{code}` },
        { name: "Яндекс Маркет", desc: "Сравнение предложений и кешбэк", url: code => `https://yandex.ru{code}` }
    ];

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('partHistory') || '[]');
        const box = document.getElementById('historyBox');
        const tags = document.getElementById('historyTags');
        if (history.length === 0) {
            box.style.display = 'none';
            return;
        }
        box.style.display = 'flex';
        tags.innerHTML = history.map(item => 
            `<button class="history-tag" onclick="selectHistory('${item}')">${item}</button>`
        ).join('');
    }

    function selectHistory(code) {
        document.getElementById('partInput').value = code;
        searchPart();
    }

    function searchPart() {
        const rawInput = document.getElementById('partInput').value.trim().toUpperCase();
        if (!rawInput) return;

        // Очищаем артикул от пробелов и дефисов для корректного поиска в магазинах
        const cleanCode = rawInput.replace(/[^A-Z0-9А-Я]/g, '');

        // Сохраняем в историю
        let history = JSON.parse(localStorage.getItem('partHistory') || '[]');
        history = [rawInput, ...history.filter(i => i !== rawInput)].slice(0, 5);
        localStorage.setItem('partHistory', JSON.stringify(history));
        renderHistory();

        // Генерируем карточки магазинов
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = stores.map(store => `
            <div class="card">
                <div>
                    <div class="card-title">${store.name}</div>
                    <div class="card-desc">${store.desc}</div>
                </div>
                <a href="${store.url(cleanCode)}" target="_blank">Смотреть цены на ${rawInput} →</a>
            </div>
        `).join('');
    }

    // Загружаем историю при открытии страницы
    renderHistory();
</script>

</body>
</html>
